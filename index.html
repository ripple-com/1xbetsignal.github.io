<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suwahas Sathsara Aviator Signal PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CYBER-TECH STYLES --- */
        :root {
            --primary: #00f2ff;
            --secondary: #0051ff;
            --bg-dark: #050b14;
            --card-bg: rgba(10, 20, 35, 0.9);
            --border: rgba(0, 242, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: var(--text-main); 
            overflow: hidden; 
        }

        .glow-bg {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 81, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
            animation: pulseBg 5s infinite ease-in-out;
        }
        @keyframes pulseBg { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .tech-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--border); 
            padding: 25px; 
            border-radius: 15px; 
            width: 95%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 242, 255, 0.05); 
            max-height: 98vh; 
            overflow-y: auto; 
            position: relative; 
            z-index: 10; 
        }
        .tech-card::-webkit-scrollbar { width: 0; }

        h1 { 
            font-family: 'Rajdhani', sans-serif; font-weight: 700; margin: 0; font-size: 26px; 
            background: linear-gradient(to right, #fff, var(--primary)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }
        
        .sub-title { font-family: 'Rajdhani', sans-serif; font-size: 11px; color: var(--primary); margin-bottom: 20px; letter-spacing: 3px; text-transform: uppercase; }
        
        /* Inputs & Buttons */
        .input-box { position: relative; margin-bottom: 20px; }
        .input-box label { 
            position: absolute; top: -10px; left: 15px; background: #0d1624; padding: 0 8px; 
            font-size: 10px; color: var(--primary); border: 1px solid var(--border);
            border-radius: 4px; z-index: 10; font-weight: 600; text-transform: uppercase;
        }
        .std-input { 
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 12px; border-radius: 8px; color: white; font-size: 18px; 
            font-family: 'Rajdhani', sans-serif; font-weight: 600; outline: none; 
            text-align: center; letter-spacing: 1px;
        }
        .std-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        
        .btn-analyze { 
            width: 100%; padding: 12px; background: linear-gradient(90deg, var(--secondary), #00c3ff); 
            border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: 700; 
            font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; cursor: pointer; 
            box-shadow: 0 5px 20px rgba(0, 81, 255, 0.4); text-transform: uppercase; margin-top: 5px; 
        }
        .btn-analyze:active { transform: scale(0.98); }

        .expiry-info { 
            font-size: 11px; color: var(--primary); margin-bottom: 15px; border: 1px solid var(--primary); 
            padding: 4px 12px; border-radius: 50px; background: rgba(0, 242, 255, 0.1); 
            display: inline-block; font-family: 'Rajdhani', sans-serif; font-weight: 600;
        }

        /* --- PROMO CODE SECTION STYLES --- */
        .promo-section-title {
            color: var(--gold); font-family: 'Rajdhani', sans-serif; font-size: 14px; margin-top: 25px; margin-bottom: 10px;
            letter-spacing: 1px; text-transform: uppercase; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;
        }
        .promo-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }
        .promo-card {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px;
            display: flex; flex-direction: column; align-items: center; transition: 0.3s;
        }
        .promo-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        
        /* LOGO STYLES - Replace URLs in HTML */
        .site-logo {
            width: 80px; height: 30px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
        }
        
        .code-box {
            background: rgba(255, 215, 0, 0.1); color: var(--gold); border: 1px dashed var(--gold);
            padding: 5px; width: 100%; border-radius: 5px; font-size: 12px; font-weight: bold;
            font-family: 'Rajdhani', sans-serif; margin-bottom: 5px; cursor: pointer;
        }
        .btn-copy-mini {
            background: var(--secondary); color: white; border: none; font-size: 10px; padding: 4px 10px;
            border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-family: 'Rajdhani', sans-serif;
        }

        /* Results & Clock */
        #resultArea { display: none; margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; animation: fadeIn 0.5s ease; }
        .result-panel { background: rgba(0, 242, 255, 0.05); border-radius: 10px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        .time-display { font-size: 32px; font-weight: 800; color: var(--primary); text-shadow: 0 0 20px rgba(0, 242, 255, 0.4); margin: 5px 0; font-family: 'Rajdhani', sans-serif; }
        .zone-display { font-size: 18px; color: var(--gold); font-weight: 600; font-family: 'Rajdhani', sans-serif; }
        
        .clock-wrapper { display: flex; align-items: stretch; gap: 10px; }
        .clock-container { flex: 2; display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .clock-input { background: transparent; border: none; color: white; font-size: 32px; font-weight: 600; width: 50px; text-align: center; outline: none; font-family: 'Rajdhani', sans-serif; }
        .clock-colon { font-size: 25px; margin: 0 2px; color: var(--primary); animation: blink 1s infinite; }
        .ampm-toggle { flex: 1; display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.3); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; }
        .ampm-btn { flex: 1; border: none; background: transparent; color: #555; font-weight: bold; cursor: pointer; font-size: 12px; font-family: 'Rajdhani', sans-serif; }
        .ampm-btn.active { background: var(--primary); color: #000; }

        .btn-logout { width: 100%; padding: 10px; background: rgba(255, 0, 0, 0.1); border: 1px solid #ff4d4d; border-radius: 8px; color: #ff4d4d; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        #loginScreen, #noticeModal { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div id="mainApp" class="tech-card">

        <button class="btn-analyze" onclick="calculateSignal()">CALCULATE SIGNAL <i class="fa-solid fa-bolt"></i></button>

        <div id="resultArea">
            <div class="result-panel">
                <div style="font-size: 10px; color: #8b9bb4; letter-spacing: 2px;">PREDICTED TIME</div>
                <div class="time-display" id="displaySignal">00:00 AM</div>
            </div>
            <div class="result-panel" style="border-color: #ffd700; background: rgba(255, 215, 0, 0.05);">
                <div style="font-size: 10px; color: #ffd700; letter-spacing: 2px;">ACTIVE ZONE</div>
                <div class="zone-display">
                    <span id="zoneStart">00:00</span> - <span id="zoneEnd">00:00</span>

            </div>

            <div class="promo-card">
                 <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/1win-logo.svg" class="site-logo" alt="1Win">
                <div class="code-box" onclick="copyPromo('SUWAHASWIN')">SUWAHASWIN</div>
                <button class="btn-copy-mini" onclick="copyPromo('SUWAHASWIN')">COPY</button>
            </div>

            <div class="promo-card">
                 <img src="https://logowik.com/content/uploads/images/paripesa5617.jpg" class="site-logo" alt="Paripesa">
                <div class="code-box" onclick="copyPromo('SUWAHASPESA')">SUWAHASPESA</div>
                <button class="btn-copy-mini" onclick="copyPromo('SUWAHASPESA')">COPY</button>
            </div>

             <div class="promo-card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Megapari_logo.svg" class="site-logo" alt="Megapari">
               <div class="code-box" onclick="copyPromo('SUWAHASMEGA')">SUWAHASMEGA</div>
               <button class="btn-copy-mini" onclick="copyPromo('SUWAHASMEGA')">COPY</button>
           </div>

           <div class="promo-card">
                <img src="https://888starz.bet/assets/img/logo.svg" class="site-logo" alt="888Starz">
               <div class="code-box" onclick="copyPromo('SUWAHAS888')">SUWAHAS888</div>
               <button class="btn-copy-mini" onclick="copyPromo('SUWAHAS888')">COPY</button>
           </div>

        <div class="social-area" style="margin-top:15px; display:flex; gap:10px;">
            <a href="https://www.youtube.com/@suwahas-sathsara-chandrasiri" target="_blank" class="social-btn yt" style="flex:1; padding:10px; background:rgba(255,0,0,0.1); border:1px solid red; color:white; text-decoration:none; border-radius:8px; text-align:center; font-size:12px;"><i class="fab fa-youtube"></i> Channel</a>
            <a href="https://chat.whatsapp.com/FSpAUoHvFSYLWKmfwwLBqC" target="_blank" class="social-btn wa" style="flex:1; padding:10px; background:rgba(0,255,0,0.1); border:1px solid lime; color:white; text-decoration:none; border-radius:8px; text-align:center; font-size:12px;"><i class="fab fa-whatsapp"></i> Group</a>
        </div>

        <button class="btn-logout" id="logoutBtn">TERMINATE SESSION <i class="fa-solid fa-power-off"></i></button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
          apiKey: "AIzaSyBmLvGb0vXkJhKVKew1sYZpHuVPo-mHvjk",
          authDomain: "aviatorsignal-ff90c.firebaseapp.com",
          projectId: "aviatorsignal-ff90c",
          storageBucket: "aviatorsignal-ff90c.firebasestorage.app",
          messagingSenderId: "656549146292",
          appId: "1:656549146292:web:f35944e4ae7b6db943f1e1",
          measurementId: "G-B5N5DG523J"
        };
        const adminWhatsapp = "94768701677"; 

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- NEW: PROMO COPY FUNCTION ---
        function copyPromo(code) {
            navigator.clipboard.writeText(code).then(() => {
                alert("Copied Code: " + code);
            }).catch(err => {
                // Fallback
                var textArea = document.createElement("textarea");
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("Copied Code: " + code);
            });
        }

        // --- EXISTING LOGIC ---
        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("loginError");
            const btn = document.getElementById("loginBtn");

            if(!email || !password) {
                errorMsg.style.display = "block"; errorMsg.innerText = "⚠️ ENTER CREDENTIALS"; return;
            }
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> CONNECTING...';
            errorMsg.style.display = "none";
            
            auth.signInWithEmailAndPassword(email, password).then((userCredential) => {
                const user = userCredential.user;
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.expiryDate && new Date() > new Date(data.expiryDate)) {
                             auth.signOut();
                             errorMsg.style.display = "block";
                             errorMsg.innerHTML = "🚫 EXPIRED. Contact Admin.";
                             btn.innerHTML = 'INITIALIZE SESSION';
                        } else {
                             document.getElementById("userExpiryDisplay").innerHTML = '<i class="fa-solid fa-clock"></i> Valid: ' + (data.expiryDate || "Unlimited");
                             document.getElementById("loginScreen").style.display = "none";
                             document.getElementById("mainApp").style.display = "block";
                        }
                    } else {
                        auth.signOut();
                        errorMsg.style.display = "block";
                        errorMsg.innerText = "⚠️ USER NOT FOUND IN DB";
                        btn.innerHTML = "LOGIN";
                    }
                });
            }).catch((error) => {
                btn.innerHTML = 'INITIALIZE SESSION';
                errorMsg.style.display = "block";
                errorMsg.innerText = "❌ FAILED: " + error.code;
            });
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            auth.signOut();
            window.location.reload();
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                         document.getElementById("userExpiryDisplay").innerHTML = '<i class="fa-solid fa-clock"></i> Valid: ' + (doc.data().expiryDate || "Unlimited");
                         document.getElementById("loginScreen").style.display = "none";
                         document.getElementById("mainApp").style.display = "block";
                    }
                });
            } else {
                document.getElementById("loginScreen").style.display = "block";
                document.getElementById("mainApp").style.display = "none";
            }
        });

        let currentAmpm = 'AM';
        function setAMPM(val) {
            currentAmpm = val;
            document.getElementById('btnAM').className = val === 'AM' ? 'ampm-btn active' : 'ampm-btn';
            document.getElementById('btnPM').className = val === 'PM' ? 'ampm-btn active' : 'ampm-btn';
        }
        function checkInput(el, nextId) {
            if (el.value.length >= 2) {
                if(nextId) document.getElementById(nextId).focus();
                else el.blur();
            }
        }
        function calculateSignal() {
            var oddInput = document.getElementById("lastOdd").value;
            var hhInput = document.getElementById("inputHour").value;
            var mmInput = document.getElementById("inputMinute").value;

            if (oddInput === "" || hhInput === "" || mmInput === "") { alert("Please enter all details!"); return; }

            var odd = parseFloat(oddInput);
            var minutesToAdd = Math.floor(odd / 2);
            var hours = parseInt(hhInput);
            var minutes = parseInt(mmInput);

            if (currentAmpm === 'PM' && hours < 12) hours = hours + 12;
            if (currentAmpm === 'AM' && hours === 12) hours = 0;

            var date = new Date();
            date.setHours(hours); date.setMinutes(minutes);
            
            var signalDate = new Date(date.getTime() + (minutesToAdd * 60000));
            var startZone = new Date(signalDate.getTime() - (2 * 60000));
            var endZone = new Date(signalDate.getTime() + (2 * 60000));

            function formatTime(dateObj) {
                var h = dateObj.getHours();
                var m = dateObj.getMinutes().toString().padStart(2, '0');
                var ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12; h = h ? h : 12;
                return h + ":" + m + " " + ampm;
            }

            document.getElementById("displaySignal").innerText = formatTime(signalDate);
            document.getElementById("zoneStart").innerText = formatTime(startZone);
            document.getElementById("zoneEnd").innerText = formatTime(endZone);
            document.getElementById("resultArea").style.display = "block";
        }
    </script>
</body>
</html>
